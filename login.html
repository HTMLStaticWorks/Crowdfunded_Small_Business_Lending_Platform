<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Sign in to your LendCircle account — the community lending platform.">
<title>Login - LendCircle</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230F6B57'/%3E%3Cpath d='M16 38c12-2 19-9 29-23 1 12-3 24-13 29-7 3-12 0-16-6Z' fill='%23c9974d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  :root {
    --auth-bg: #0F2C25;
    --auth-card: #ffffff;
    --auth-text: #1E293B;
    --auth-muted: #64748B;
    --auth-border: #E2E8F0;
    --auth-input-bg: #ffffff;
    --auth-primary: #0F6B57;
    --auth-accent: #C9974D;
  }
  [data-theme="dark"] {
    --auth-bg: #0F2C25;
    --auth-card: #12221E;
    --auth-text: #E8F0ED;
    --auth-muted: #9FB2AA;
    --auth-border: rgba(255,255,255,0.1);
    --auth-input-bg: #0a1a17;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    min-height: 100vh;
    background: var(--auth-bg);
    color: var(--auth-text);
    font-family: 'DM Sans', sans-serif;
    display: flex; flex-direction: column;
    transition: background 0.3s, color 0.3s;
  }

  /* Top Bar */
  .auth-topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 40px;
  }
  .auth-logo {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; font-family: 'Playfair Display', serif;
    font-size: 1.4rem; font-weight: 700; color: #fff;
  }
  .auth-logo-icon {
    width: 40px; height: 40px; background: #0F2C25;
    color: var(--auth-accent); border-radius: 12px;
    display: grid; place-items: center; font-size: 1.2rem;
    border: none;
  }
  [data-theme="dark"] .auth-logo { color: #E8F0ED; }
  [data-theme="dark"] .auth-logo-icon { background: #0F2C25; }

  .auth-topbar-actions { display: flex; align-items: center; gap: 8px; }
  .auth-icon-btn {
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.1); color: #fff;
    display: grid; place-items: center; cursor: pointer;
    font-size: 0.9rem; transition: 0.2s;
  }
  [data-theme="dark"] .auth-icon-btn { border-color: rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); }
  .auth-icon-btn:hover { background: rgba(255,255,255,0.25); border-color: #fff; }

  /* Main */
  .auth-main {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 100px 24px 60px; position: relative;
  }

  .auth-card {
    background: var(--auth-card);
    border-radius: 28px; padding: 52px 48px;
    border: 1px solid var(--auth-border);
    box-shadow: 0 32px 80px rgba(0,0,0,0.25);
    width: 100%; max-width: 480px; position: relative;
  }
  [data-theme="dark"] .auth-card { box-shadow: 0 32px 80px rgba(0,0,0,0.5); }

  .auth-card::before {
    content: ''; position: absolute; top: 0; left: 48px; right: 48px; height: 3px;
    background: linear-gradient(90deg, var(--auth-primary), var(--auth-accent));
    border-radius: 0 0 4px 4px;
  }

  .auth-card-header { text-align: center; margin-bottom: 36px; }
  .auth-card-header h1 {
    font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700;
    color: var(--auth-text); margin: 0 0 8px;
  }
  .auth-card-header p { color: var(--auth-muted); margin: 0; font-size: 0.95rem; }

  /* Account toggle */
  .account-toggle {
    display: flex; background: var(--auth-input-bg);
    border: 1px solid var(--auth-border); border-radius: 99px;
    padding: 4px; margin-bottom: 32px; position: relative;
  }
  .account-toggle-slider {
    position: absolute; top: 4px; bottom: 4px; width: calc(50% - 4px);
    background: var(--auth-primary); border-radius: 99px;
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); z-index: 0;
  }
  [data-account="investor"] .account-toggle-slider { transform: translateX(100%); }
  .account-toggle-btn {
    flex: 1; text-align: center; padding: 11px; border-radius: 99px;
    border: none; background: transparent; font-weight: 600; font-size: 0.9rem;
    color: var(--auth-muted); cursor: pointer; position: relative; z-index: 1; transition: color 0.2s;
  }
  .account-toggle-btn.active { color: #fff; }

  /* Fields */
  .field-group { margin-bottom: 20px; }
  .field-label { display: block; font-weight: 600; font-size: 0.88rem; color: var(--auth-text); margin-bottom: 8px; }
  .field-wrap { position: relative; }
  .field-input {
    width: 100%; padding: 14px 16px; border-radius: 12px;
    border: 1.5px solid var(--auth-border);
    background: var(--auth-input-bg); color: var(--auth-text);
    font-family: inherit; font-size: 0.95rem; outline: none; transition: 0.2s;
  }
  .field-input:focus { border-color: var(--auth-primary); box-shadow: 0 0 0 4px rgba(15,107,87,0.12); }
  .field-input::placeholder { color: var(--auth-muted); }
  .field-input.has-eye { padding-right: 44px; }
  html[dir="rtl"] .field-input.has-eye { padding-right: 16px; padding-left: 44px; }
  .eye-toggle {
    position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
    color: var(--auth-muted); cursor: pointer; font-size: 1rem; padding: 4px;
    background: none; border: none; transition: color 0.2s;
  }
  .eye-toggle:hover { color: var(--auth-primary); }
  html[dir="rtl"] .eye-toggle { right: auto; left: 13px; }

  /* Options */
  .field-options {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 28px; flex-wrap: wrap; gap: 8px;
  }
  .remember-label {
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; font-size: 0.88rem; color: var(--auth-muted); font-weight: 500;
  }
  .remember-label input { width: 16px; height: 16px; accent-color: var(--auth-primary); cursor: pointer; }
  .forgot-link { font-size: 0.88rem; font-weight: 600; color: var(--auth-primary); text-decoration: none; }
  .forgot-link:hover { text-decoration: underline; }

  /* Submit */
  .btn-submit {
    width: 100%; padding: 16px; border-radius: 99px; background: var(--auth-primary);
    color: #fff; border: none; font-size: 1rem; font-weight: 700; cursor: pointer;
    transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px;
  }
  .btn-submit:hover { background: #0a5243; transform: translateY(-2px); box-shadow: 0 10px 24px rgba(15,107,87,0.3); }
  .btn-submit .spinner {
    display: none; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite;
  }
  .btn-submit.loading .btn-text { display: none; }
  .btn-submit.loading .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Divider */
  .auth-divider {
    display: flex; align-items: center; margin: 28px 0;
    color: var(--auth-muted); font-size: 0.8rem; font-weight: 600; letter-spacing: 0.5px;
  }
  .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--auth-border); }
  .auth-divider::before { margin-right: 14px; }
  .auth-divider::after { margin-left: 14px; }

  /* Social */
  .social-buttons { display: flex; gap: 12px; }
  .btn-social {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 13px 8px; border-radius: 12px;
    border: 1.5px solid var(--auth-border); background: var(--auth-input-bg);
    color: var(--auth-text); font-weight: 600; font-size: 0.85rem;
    cursor: pointer; transition: 0.2s; text-decoration: none;
  }
  .btn-social:hover { border-color: var(--auth-primary); background: rgba(15,107,87,0.05); transform: translateY(-1px); }
  .btn-social img { width: 18px; height: 18px; flex-shrink: 0; }
  .btn-social .social-icon { font-size: 1.1rem; flex-shrink: 0; }

  /* Footer */
  .auth-footer-link { text-align: center; margin-top: 28px; font-size: 0.9rem; color: var(--auth-muted); }
  .auth-footer-link a { color: var(--auth-primary); font-weight: 600; text-decoration: none; }
  .auth-footer-link a:hover { text-decoration: underline; }

  #loginFeedback { display: none; margin-top: 14px; text-align: center; font-size: 0.9rem; font-weight: 600; border-radius: 10px; padding: 12px; }

  @media (max-width: 640px) {
    .auth-topbar { padding: 16px 20px; }
    .auth-card { padding: 40px 24px; border-radius: 20px; }
    .auth-main { padding-top: 80px; }
    .social-buttons { flex-direction: column; }
  }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="auth-topbar">
  <a href="index.html" class="auth-logo">
    <div class="auth-logo-icon"><i class="fa-solid fa-leaf"></i></div>
    LendCircle
  </a>
  <div class="auth-topbar-actions">
    <button class="auth-icon-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle dark mode">
      <i class="fa-solid fa-moon" id="themeIcon"></i>
    </button>
    <button class="auth-icon-btn" onclick="toggleRTL()" title="Toggle RTL">
      <i class="fa-solid fa-arrow-right-arrow-left"></i>
    </button>
  </div>
</div>

<!-- Form -->
<main class="auth-main">
  <div class="auth-card">
    <div class="auth-card-header">
      <h1>Welcome Back</h1>
      <p>Sign in to continue to your LendCircle account.</p>
    </div>

    <div class="account-toggle" id="accountToggle" data-account="borrower">
      <div class="account-toggle-slider"></div>
      <button type="button" class="account-toggle-btn active" onclick="setAccount('borrower', this)">Borrower</button>
      <button type="button" class="account-toggle-btn" onclick="setAccount('investor', this)">Investor</button>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
      <div class="field-group">
        <label class="field-label">Email Address</label>
        <div class="field-wrap">
          <input type="email" class="field-input" id="email" placeholder="Enter your email address" required>
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Password</label>
        <div class="field-wrap">
          <input type="password" class="field-input has-eye" id="password" placeholder="Enter your password" required>
          <button type="button" class="eye-toggle" onclick="toggleEye()" aria-label="Toggle password">
            <i class="fa-regular fa-eye-slash" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <div class="field-options">
        <label class="remember-label">
          <input type="checkbox"> Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-submit" id="loginBtn">
        <span class="btn-text">Sign In</span>
        <div class="spinner"></div>
      </button>
      <div id="loginFeedback"></div>

      <div class="auth-divider">OR CONTINUE WITH</div>

      <div class="social-buttons">
        <button type="button" class="btn-social">
          <span class="social-icon" style="color:#EA4335;"><i class="fa-brands fa-google"></i></span>
          Google
        </button>
        <button type="button" class="btn-social">
          <span class="social-icon" style="color:#1877F2;"><i class="fa-brands fa-facebook-f"></i></span>
          Facebook
        </button>
        <button type="button" class="btn-social">
          <span class="social-icon" style="color:var(--auth-text);"><i class="fa-brands fa-apple"></i></span>
          Apple
        </button>
      </div>
    </form>

    <div class="auth-footer-link">
      Don't have an account? <a href="signup.html">Create one free</a>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>
<script>
  let accountType = 'borrower';

  function setAccount(type, btn) {
    accountType = type;
    document.getElementById('accountToggle').setAttribute('data-account', type);
    document.querySelectorAll('.account-toggle-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function toggleEye() {
    const input = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    input.type = input.type === 'password' ? 'text' : 'password';
    icon.className = input.type === 'password' ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
  }

  function updateThemeIcon() {
    const isDark = document.documentElement.dataset.theme === 'dark';
    document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
  }
  const _orig = window.toggleTheme;
  window.toggleTheme = function() { _orig && _orig(); updateThemeIcon(); };
  document.addEventListener('DOMContentLoaded', updateThemeIcon);

  function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.classList.add('loading');
    setTimeout(() => {
      btn.classList.remove('loading');
      const dest = accountType === 'investor' ? 'investor-dashboard.html' : 'borrower-dashboard.html';
      const fb = document.getElementById('loginFeedback');
      fb.style.display = 'block';
      fb.style.background = 'rgba(16,185,129,0.1)';
      fb.style.color = '#10B981';
      fb.textContent = 'Signed in! Redirecting...';
      setTimeout(() => { window.location.href = dest; }, 1000);
    }, 1500);
  }
</script>
</body>
</html>
